version: 2
updates:
  # Frontend dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    allow:
      - dependency-type: 'all'
    reviewers:
      - 'robinzor147-source'
    commit-message:
      prefix: 'chore(deps):'
      prefix-development: 'chore(deps-dev):'
      include: 'scope'

  # Backend dependencies
  - package-ecosystem: 'npm'
    directory: '/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
    allow:
      - dependency-type: 'all'
    reviewers:
      - 'robinzor147-source'
    commit-message:
      prefix: 'chore(deps):'
      prefix-development: 'chore(deps-dev):'
      include: 'scope'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
    reviewers:
      - 'robinzor147-source'
    commit-message:
      prefix: 'ci:'
      include: 'scope'
