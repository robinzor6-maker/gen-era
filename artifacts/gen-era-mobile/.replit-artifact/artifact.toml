kind = "mobile"
previewPath = "/gen-era-mobile/"
title = "GEN ERA Mobile"
version = "1.0.0"
id = "artifacts/gen-era-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/gen-era-mobile/" ]
localPort = 20856

[services.development]
run = "pnpm --filter @workspace/gen-era-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gen-era-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/gen-era-mobile", "run", "serve" ]

[services.env]
PORT = "20856"
BASE_PATH = "/gen-era-mobile/"
