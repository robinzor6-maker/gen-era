version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gen-era-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gen_era
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gen-era-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: gen-era-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gen_era
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - gen-era-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gen-era-frontend
    ports:
      - "5000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gen-era-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  gen-era-network:
    driver: bridge
